[versions]
agp = "8.7.3"
kotlin = "2.0.21"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.2.0"
cardview = "1.0.0"
recyclerview = "1.3.2"
room = "2.6.1"
lifecycle = "2.8.7"
mlkit-barcode = "17.3.0"
camera = "1.4.1"
itext = "7.2.5"
zxing = "3.5.3"
